<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drop Diário</title>
<style>
body{
    background:#111;
    color:white;
    text-align:center;
    font-family:Arial;
    padding:20px;
}
button{
    padding:15px 30px;
    font-size:18px;
    border-radius:10px;
    border:none;
    background:gold;
    cursor:pointer;
}
</style>
</head>
<body>

<h2>🎰 DROP DIÁRIO</h2>

<button onclick="sortear()" id="botaoSortear">GIRAR</button>

<div id="resultado" style="margin-top:20px;"></div>

<script>

const premios = [
    {nome:"Pergaminho Raro", chance:46, imagem:"Imagens/PergaminhoRaro.png"},
    {nome:"Pergaminho Épico", chance:25, imagem:"Imagens/PergaminhoEpico.png"},
    {nome:"Pergaminho Lendário", chance:15, imagem:"Imagens/Pergaminholendario.png"},
    {nome:"Hiramekarei", chance:2, imagem:"Imagens/Hiramekarei.jpg"},
    {nome:"Kiba", chance:2, imagem:"Imagens/Kiba.jpg"},
    {nome:"Kabutowari", chance:2, imagem:"Imagens/Kabutowari.jpg"},
    {nome:"Kubikiribouchou", chance:2, imagem:"Imagens/Kubikiribouchou .jpg"},
    {nome:"Nuibari", chance:2, imagem:"Imagens/Nuibari.jpg"},
    {nome:"Samehada", chance:2, imagem:"Imagens/Samehada.jpg"},
    {nome:"Shibuki", chance:2, imagem:"Imagens/Shibuki.jpg"},
];

const botao = document.getElementById("botaoSortear");
const resultado = document.getElementById("resultado");

function hojeString(){
    return new Date().toISOString().split('T')[0];
}

function jaSorteouHoje(){
    return localStorage.getItem("ultimoSorteio") === hojeString();
}

function salvarSorteioHoje(){
    localStorage.setItem("ultimoSorteio", hojeString());
}

function tempoRestante(){
    const agora = new Date();
    const meiaNoite = new Date();
    meiaNoite.setHours(24,0,0,0);
    const diff = meiaNoite - agora;

    const horas = Math.floor(diff / (1000 * 60 * 60));
    const minutos = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const segundos = Math.floor((diff % (1000 * 60)) / 1000);

    return `${horas}h ${minutos}m ${segundos}s`;
}

function iniciarContador(){
    botao.disabled = true;
    botao.innerText = "Disponível amanhã";

    const contador = document.createElement("div");
    contador.style.marginTop = "15px";
    contador.style.color = "gold";
    resultado.appendChild(contador);

    setInterval(()=>{
        contador.innerHTML = `⏳ Novo sorteio em: <b>${tempoRestante()}</b>`;
    },1000);
}

function verificarEstado(){
    if(jaSorteouHoje()){
        iniciarContador();
    }
}

function sortear(){

    if(jaSorteouHoje()){
        iniciarContador();
        return;
    }

    salvarSorteioHoje();
    botao.disabled = true;

    let numero = Math.random() * 100;
    let acumulado = 0;
    let premioEscolhido;

    for(let i=0; i<premios.length; i++){
        acumulado += premios[i].chance;
        if(numero <= acumulado){
            premioEscolhido = premios[i];
            break;
        }
    }

    setTimeout(()=>{
        resultado.innerHTML = 
        `🎉 Você ganhou: <b>${premioEscolhido.nome}</b><br>
        <img src="${premioEscolhido.imagem}" width="200">`;
        iniciarContador();
    },2000);
}

verificarEstado();

</script>
</body>
</html>
